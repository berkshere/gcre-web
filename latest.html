/*

/* ======================================================
   HEADER
====================================================== */

async function loadSiteHeader() {

    const container =
        document.getElementById(
            "site-header"
        );


    if (!container) {

        return;

    }


    try {

        const response =
            await fetch(
                "./index.html?t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load index.html"
            );

        }


        const html =
            await response.text();


        const parser =
            new DOMParser();


        const doc =
            parser.parseFromString(
                html,
                "text/html"
            );


        const header =
            doc.querySelector(
                "header"
            );


        if (!header) {

            throw new Error(
                "Header not found in index.html"
            );

        }


        container.innerHTML =
            header.outerHTML;


        /*
        -----------------------------------------------
        Active Latest navigation
        -----------------------------------------------
        */

        const links =
            container.querySelectorAll(
                "a"
            );


        links.forEach(
            link => {

                const href =
                    (
                        link.getAttribute(
                            "href"
                        ) || ""
                    ).toLowerCase();


                if (
                    href.includes(
                        "latest"
                    )
                ) {

                    link.classList.add(
                        "active"
                    );

                }

            }
        );


        console.log(
            "GCRE: Header loaded from index.html"
        );

    }
    catch (error) {

        console.error(
            "GCRE Header error:",
            error
        );

    }

}



/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ======================================================
   INLINE MARKDOWN
====================================================== */

function renderInline(
    text
) {

    let value =
        escapeHtml(
            text
        );


    /*
    Bold
    */

    value =
        value.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    /*
    Italic
    */

    value =
        value.replace(
            /(?<!\*)\*([^*]+)\*(?!\*)/g,
            "<em>$1</em>"
        );


    /*
    Inline code
    */

    value =
        value.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


    /*
    Markdown link
    */

    value =
        value.replace(
            /\[([^\]]+)\]\(([^)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>'
        );


    return value;

}



/* ======================================================
   CHECK NUMERIC CELL
====================================================== */

function isNumericCell(
    value
) {

    const text =
        String(value)
            .trim()
            .replace(
                /,/g,
                ""
            );


    /*
    1.0257
    2.57%
    -0.01%
    15.59
    90.00
    2026-08-12
    */

    return /^[-+]?\d+(?:\.\d+)?%?$/.test(
        text
    );

}



/* ======================================================
   PARSE TABLE ALIGNMENT
====================================================== */

function parseAlignment(
    separator
) {

    const text =
        separator.trim();


    const left =
        text.startsWith(":");


    const right =
        text.endsWith(":");


    if (
        left &&
        right
    ) {

        return "center";

    }


    if (right) {

        return "right";

    }


    if (left) {

        return "left";

    }


    return "left";

}



/* ======================================================
   MARKDOWN TABLE
====================================================== */

function renderTable(
    tableLines
) {

    if (
        tableLines.length < 2
    ) {

        return "";

    }


    const headerLine =
        tableLines[0];


    const separatorLine =
        tableLines[1];


    function splitRow(
        line
    ) {

        return line
            .trim()
            .replace(
                /^\|/,
                ""
            )
            .replace(
                /\|$/,
                ""
            )
            .split("|")
            .map(
                cell =>
                    cell.trim()
            );

    }


    const headers =
        splitRow(
            headerLine
        );


    const separators =
        splitRow(
            separatorLine
        );


    const alignments =
        headers.map(
            (
                _,
                index
            ) => {

                return parseAlignment(
                    separators[index]
                    || ""
                );

            }
        );


    let html = `

        <div class="report-table-wrapper">

        <table>

        <thead>

        <tr>

    `;


    headers.forEach(
        (
            header,
            index
        ) => {


            const alignment =
                alignments[index];


            let className =
                "";


            if (
                alignment === "right"
            ) {

                className =
                    "numeric-column";

            }


            html +=

                `<th class="${className}">` +

                renderInline(
                    header
                ) +

                `</th>`;

        }
    );


    html += `

        </tr>

        </thead>

        <tbody>

    `;



    /*
    -----------------------------------------------
    Data rows
    -----------------------------------------------
    */

    for (
        let i = 2;
        i < tableLines.length;
        i++
    ) {


        const cells =
            splitRow(
                tableLines[i]
            );


        if (
            cells.length === 0
        ) {

            continue;

        }


        html +=
            "<tr>";


        cells.forEach(
            (
                cell,
                index
            ) => {


                let alignment =
                    alignments[index]
                    || "left";


                /*
                如果 Markdown 没明确指定右对齐，
                但内容本身是纯数字，
                自动右对齐。
                */

                if (
                    alignment === "left"
                    &&
                    index > 0
                    &&
                    isNumericCell(
                        cell
                    )
                ) {

                    alignment =
                        "right";

                }


                let className =
                    "";


                if (
                    alignment === "right"
                ) {

                    className =
                        "numeric-column";

                }


                /*
                Asset
                */

                if (
                    index === 0
                ) {

                    className +=
                        " asset-column";

                }


                /*
                Signal
                */

                const header =
                    (
                        headers[index]
                        || ""
                    ).toLowerCase();


                if (
                    header === "signal"
                ) {

                    className +=
                        " signal-column";

                }


                /*
                Comment
                */

                if (
                    header === "comment"
                ) {

                    className +=
                        " comment-column";

                }


                html +=

                    `<td class="${className}">` +

                    renderInline(
                        cell
                    ) +

                    `</td>`;

            }
        );


        html +=
            "</tr>";

    }


    html += `

        </tbody>

        </table>

        </div>

    `;


    return html;

}



/* ======================================================
   MARKDOWN → HTML
====================================================== */

function markdownToHtml(
    markdown
) {


    const lines =
        markdown
            .replace(
                /\r\n/g,
                "\n"
            )
            .split("\n");


    let html = "";

    let paragraph = [];

    let tableLines = [];

    let listType = null;



    function flushParagraph() {

        if (
            paragraph.length === 0
        ) {

            return;

        }


        const text =
            paragraph
                .join(" ")
                .trim();


        if (text) {

            html +=

                "<p>" +

                renderInline(
                    text
                ) +

                "</p>";

        }


        paragraph = [];

    }



    function flushTable() {

        if (
            tableLines.length === 0
        ) {

            return;

        }


        html +=
            renderTable(
                tableLines
            );


        tableLines = [];

    }



    function closeList() {

        if (
            listType === "ul"
        ) {

            html +=
                "</ul>";

        }


        if (
            listType === "ol"
        ) {

            html +=
                "</ol>";

        }


        listType =
            null;

    }



    for (
        let i = 0;
        i < lines.length;
        i++
    ) {


        const line =
            lines[i];


        const trimmed =
            line.trim();



        /* ------------------------------------------
           Empty
        ------------------------------------------ */

        if (
            trimmed === ""
        ) {

            flushParagraph();

            flushTable();

            closeList();

            continue;

        }



        /* ------------------------------------------
           Table detection
        ------------------------------------------ */

        if (
            trimmed.startsWith("|")
        ) {


            flushParagraph();

            closeList();


            /*
            第一行必须有下一行 separator
            */

            if (
                tableLines.length === 0
                &&
                i + 1 < lines.length
                &&
                /^\s*\|?[\s:-]+\|[\s|:-]+\s*$/.test(
                    lines[i + 1]
                )
            ) {

                tableLines.push(
                    line
                );


                continue;

            }


            if (
                tableLines.length > 0
            ) {

                tableLines.push(
                    line
                );

                continue;

            }

        }
        else {

            if (
                tableLines.length > 0
            ) {

                flushTable();

            }

        }



        /* ------------------------------------------
           H1
        ------------------------------------------ */

        if (
            trimmed.startsWith("# ")
        ) {

            flushParagraph();

            closeList();

            html +=

                "<h1>" +

                renderInline(
                    trimmed.substring(2)
                ) +

                "</h1>";

            continue;

        }



        /* ------------------------------------------
           H2
        ------------------------------------------ */

        if (
            trimmed.startsWith("## ")
        ) {

            flushParagraph();

            closeList();

            html +=

                "<h2>" +

                renderInline(
                    trimmed.substring(3)
                ) +

                "</h2>";

            continue;

        }



        /* ------------------------------------------
           H3
        ------------------------------------------ */

        if (
            trimmed.startsWith("### ")
        ) {

            flushParagraph();

            closeList();

            html +=

                "<h3>" +

                renderInline(
                    trimmed.substring(4)
                ) +

                "</h3>";

            continue;

        }



        /* ------------------------------------------
           HR
        ------------------------------------------ */

        if (
            /^---+$/.test(
                trimmed
            )
        ) {

            flushParagraph();

            closeList();

            html +=
                "<hr>";

            continue;

        }



        /* ------------------------------------------
           Ordered list
        ------------------------------------------ */

        const ordered =
            trimmed.match(
                /^(\d+)\.\s+(.*)$/
            );


        if (
            ordered
        ) {

            flushParagraph();


            if (
                listType !== "ol"
            ) {

                closeList();

                html +=
                    "<ol>";

                listType =
                    "ol";

            }


            html +=

                "<li>" +

                renderInline(
                    ordered[2]
                ) +

                "</li>";


            continue;

        }



        /* ------------------------------------------
           Unordered list
        ------------------------------------------ */

        const unordered =
            trimmed.match(
                /^[-*]\s+(.*)$/
            );


        if (
            unordered
        ) {

            flushParagraph();


            if (
                listType !== "ul"
            ) {

                closeList();

                html +=
                    "<ul>";

                listType =
                    "ul";

            }


            html +=

                "<li>" +

                renderInline(
                    unordered[1]
                ) +

                "</li>";


            continue;

        }



        /* ------------------------------------------
           Normal text
        ------------------------------------------ */

        closeList();

        paragraph.push(
            trimmed
        );

    }


    flushParagraph();

    flushTable();

    closeList();


    return html;

}



/* ======================================================
   FIND LATEST REPORT
====================================================== */

async function findLatestReport() {


    /*
    ====================================================
    GCRE Latest Report Resolver V2

    数据源：

    reports/archive.json

    格式：

    {
        "updated":"...",
        "reports":[
            {
                "date":"2026-08-17",
                "file":
                "GCRE_Sell_Side_Report_20260817.md"
            }
        ]
    }

    自动寻找最新日期报告

    ====================================================
    */


    try {


        const response =
            await fetch(
                "./reports/archive.json?t="
                +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (
            response.ok
        ) {


            const archive =
                await response.json();



            /*
            --------------------------------------------
            兼容两种结构

            1.
            {
                reports:[]
            }


            2.
            []

            --------------------------------------------
            */


            let reports =
                [];


            if (
                Array.isArray(
                    archive
                )
            ) {

                reports =
                    archive;

            }


            else if (
                archive &&
                Array.isArray(
                    archive.reports
                )
            ) {

                reports =
                    archive.reports;

            }



            if (
                reports.length > 0
            ) {


                reports.sort(
                    function(a,b){


                        const da =
                            String(
                                a.date ||
                                a.report_date ||
                                a.file ||
                                ""
                            );


                        const db =
                            String(
                                b.date ||
                                b.report_date ||
                                b.file ||
                                ""
                            );


                        return db.localeCompare(
                            da
                        );

                    }
                );



                const latest =
                    reports[0];



                const file =
                    latest.file ||
                    latest.report_file ||
                    latest.filename;



                if (
                    file
                ) {


                    console.log(
                        "GCRE latest report:",
                        file
                    );


                    return (
                        "./reports/"
                        +
                        file
                    );

                }

            }


        }


    }
    catch(error){


        console.error(
            "archive.json error:",
            error
        );


    }



    /*
    ====================================================
    FALLBACK

    不再固定日期

    自动寻找最新日期文件名

    ====================================================
    */


    const candidates = [

        "GCRE_Sell_Side_Report_20260817.md",

        "GCRE_Sell_Side_Report_20260812.md"

    ];



    for(
        const file of candidates
    ){


        try{


            const response =
                await fetch(
                    "./reports/"
                    +
                    file
                    +
                    "?t="
                    +
                    Date.now(),
                    {
                        cache:
                            "no-store"
                    }
                );


            if(
                response.ok
            ){


                return (
                    "./reports/"
                    +
                    file
                );

            }


        }
        catch(error){

            continue;

        }

    }



    return null;


}

/* ======================================================
   LOAD REPORT
====================================================== */

async function loadLatestReport() {


    const container =
        document.getElementById(
            "report-container"
        );


    const dateElement =
        document.getElementById(
            "report-date"
        );


    try {


        const reportUrl =
            await findLatestReport();


        if (
            !reportUrl
        ) {

            throw new Error(
                "No GCRE Sell-Side report found."
            );

        }


        const response =
            await fetch(
                reportUrl +
                "?t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const markdown =
            await response.text();


        if (
            !markdown.trim()
        ) {

            throw new Error(
                "Report file is empty."
            );

        }



        /*
        ----------------------------------------------
        Report Date
        ----------------------------------------------
        */

        const dateMatch =
            markdown.match(
                /\*\*Report Date:\*\*\s*(.+)/
            );


        if (
            dateMatch
        ) {

            dateElement.textContent =
                "Report Date: " +
                dateMatch[1].trim();

        }
        else {

            dateElement.textContent =
                "Latest GCRE Report";

        }



        /*
        ----------------------------------------------
        Markdown Render
        ----------------------------------------------
        */

        container.innerHTML =
            markdownToHtml(
                markdown
            );


        console.log(
            "GCRE Latest Report:",
            reportUrl
        );


    }
    catch (
        error
    ) {


        console.error(
            "GCRE Latest Report Error:",
            error
        );


        dateElement.textContent =
            "Unable to load latest report";


        container.innerHTML = `

            <div class="report-error">

                <strong>
                    Unable to load report
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}
