<!-- =====================================================
     ARCHIVE JSON LOADER
===================================================== -->

<script>

fetch("./reports/archive.json")

    .then(response => {

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        return response.json();

    })

    .then(data => {

        const tbody =
            document.querySelector("#archive-data");

        const reports =
            data.reports || [];


        if (reports.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6">
                        No archive data available.
                    </td>
                </tr>
            `;

            return;
        }


        tbody.innerHTML = reports.map(row => `

            <tr>

                <td>
                    ${row.date || "--"}
                </td>

                <td>
                    ${
                        row.NAV !== null &&
                        row.NAV !== undefined
                            ? Number(row.NAV).toFixed(4)
                            : "--"
                    }
                </td>

                <td>
                    ${
                        row.cumulative_return !== null &&
                        row.cumulative_return !== undefined
                            ? (
                                Number(row.cumulative_return) * 100
                              ).toFixed(2) + "%"
                            : "--"
                    }
                </td>

                <td>
                    ${
                        row.VIX !== null &&
                        row.VIX !== undefined
                            ? Number(row.VIX).toFixed(2)
                            : "--"
                    }
                </td>

                <td>
                    ${
                        row.economic_cycle !== null &&
                        row.economic_cycle !== undefined
                            ? row.economic_cycle
                            : "--"
                    }
                </td>

                <td>
                    <a href="./report.html?file=${encodeURIComponent(row.file)}">
                     View Report
                    </a>
                </td>

            </tr>

        `).join("");

    })

    .catch(error => {

        console.error(
            "Archive loading failed:",
            error
        );

        const tbody =
            document.querySelector("#archive-data");

        tbody.innerHTML = `
            <tr>
                <td colspan="6">
                    Unable to load archive.
                </td>
            </tr>
        `;

    });

</script>


</body>
