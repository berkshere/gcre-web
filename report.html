<script>


/* ======================================================
   GET REPORT FILE
====================================================== */

function getReportFile() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const file =
        params.get("file");


    if (file) {

        return file;

    }


    /*
    Default latest report
    */

    return "GCRE_Sell_Side_Report_20260812.md";

}



/* ======================================================
   LOAD REPORT
====================================================== */

async function loadReport() {

    const content =
        document.getElementById(
            "report-content"
        );


    const title =
        document.getElementById(
            "report-title"
        );


    const dateElement =
        document.getElementById(
            "report-date"
        );


    const file =
        getReportFile();


    try {


        const response =
            await fetch(
                "./reports/" +
                encodeURIComponent(file) +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const markdown =
            await response.text();


        /*
        --------------------------------------------------
        Convert Markdown to HTML
        --------------------------------------------------
        */

        const html =
            markdownToHTML(
                markdown
            );


        content.innerHTML =
            html;


        /*
        --------------------------------------------------
        Extract report date
        --------------------------------------------------
        */

        const date =
            extractReportDate(
                markdown,
                file
            );


        if (date) {

            dateElement.textContent =
                "Report Date: " + date;

        }


        /*
        --------------------------------------------------
        Update browser title
        --------------------------------------------------
        */

        document.title =
            "GCRE | " +
            (
                date ||
                "Daily Report"
            );


    }
    catch (error) {


        console.error(
            "Report loading error:",
            error
        );


        content.innerHTML = `

            <div class="empty-state">

                Unable to load report.

                <br><br>

                ${escapeHTML(file)}

            </div>

        `;

    }

}



/* ======================================================
   MARKDOWN → HTML
====================================================== */

function markdownToHTML(
    markdown
) {


    let text =
        markdown
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    /*
    ------------------------------------------------------
    Escape HTML first
    ------------------------------------------------------
    */

    text =
        escapeHTML(
            text
        );


    /*
    ------------------------------------------------------
    Horizontal rules
    ------------------------------------------------------
    */

    text =
        text.replace(
            /^\s*---+\s*$/gm,
            "<hr>"
        );


    /*
    ------------------------------------------------------
    Tables
    ------------------------------------------------------
    */

    text =
        convertTables(
            text
        );


    /*
    ------------------------------------------------------
    Headings
    ------------------------------------------------------
    */

    text =
        text.replace(
            /^###### (.+)$/gm,
            "<h6>$1</h6>"
        );


    text =
        text.replace(
            /^##### (.+)$/gm,
            "<h5>$1</h5>"
        );


    text =
        text.replace(
            /^#### (.+)$/gm,
            "<h4>$1</h4>"
        );


    text =
        text.replace(
            /^### (.+)$/gm,
            "<h3>$1</h3>"
        );


    text =
        text.replace(
            /^## (.+)$/gm,
            "<h2>$1</h2>"
        );


    text =
        text.replace(
            /^# (.+)$/gm,
            "<h1>$1</h1>"
        );


    /*
    ------------------------------------------------------
    Bold
    ------------------------------------------------------
    */

    text =
        text.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );


    /*
    ------------------------------------------------------
    Italic
    ------------------------------------------------------
    */

    text =
        text.replace(
            /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
            "<em>$1</em>"
        );


    /*
    ------------------------------------------------------
    Numbered lists
    ------------------------------------------------------
    */

    text =
        text.replace(
            /(?:^|\n)(\d+)\. (.+)(?=\n|$)/g,
            function(
                match,
                number,
                item
            ) {

                return (
                    "\n<ol>" +
                    "<li>" +
                    item +
                    "</li>" +
                    "</ol>\n"
                );

            }
        );


    /*
    ------------------------------------------------------
    Bullet lists
    ------------------------------------------------------
    */

    text =
        text.replace(
            /(?:^|\n)[ \t]*[-*] (.+)(?=\n|$)/g,
            function(
                match,
                item
            ) {

                return (
                    "\n<ul>" +
                    "<li>" +
                    item +
                    "</li>" +
                    "</ul>\n"
                );

            }
        );


    /*
    ------------------------------------------------------
    Paragraphs
    ------------------------------------------------------
    */

   const blocks =
    text
    .split(/\n{2,}/)
    .map(
        block =>
            block.trim()
    )
    .filter(
        block =>
            block.length > 0
    );

    const result =
        [];


    blocks.forEach(
        block => {


            /*
            Already HTML block
            */

            if (
                block.startsWith("<h1") ||
                block.startsWith("<h2") ||
                block.startsWith("<h3") ||
                block.startsWith("<h4") ||
                block.startsWith("<h5") ||
                block.startsWith("<h6") ||
                block.startsWith("<table") ||
                block.startsWith("<div class=\"table-wrapper\"") ||
                block.startsWith("<hr") ||
                block.startsWith("<ul") ||
                block.startsWith("<ol")
            ) {

                result.push(
                    block
                );

                return;

            }


            /*
            Single line
            */

            if (
                !block.includes("\n")
            ) {

                result.push(
                    "<p>" +
                    block +
                    "</p>"
                );

                return;

            }


            /*
            Multi-line text
            */

            result.push(
                "<p>" +
                block.replace(
                    /\n/g,
                    "<br>"
                ) +
                "</p>"
            );

        }
    );


    return result.join(
        "\n"
    );

}



/* ======================================================
   TABLE CONVERTER
====================================================== */
/* ======================================================
   TABLE CONVERTER
   GCRE ROBUST MARKDOWN TABLE PARSER
====================================================== */

function convertTables(text) {

    const lines = text
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n");

    const output = [];

    let i = 0;

    while (i < lines.length) {

        const current =
            lines[i].trim();

        /*
        --------------------------------------------------
        空行
        --------------------------------------------------
        */
        if (current === "") {

            output.push("");

            i++;

            continue;
        }

        /*
        --------------------------------------------------
        判断当前行是否可能是表格行
        支持：

        | VIX | 15.2200 |
        \| VIX | 15.2200 |
        --------------------------------------------------
        */

        const currentIsTableRow =
            current.startsWith("|") ||
            current.startsWith("\\|");

        if (currentIsTableRow) {

            /*
            --------------------------------------------------
            找下一条非空行
            --------------------------------------------------
            */

            let separatorIndex =
                i + 1;

            while (
                separatorIndex < lines.length &&
                lines[separatorIndex].trim() === ""
            ) {
                separatorIndex++;
            }

            /*
            --------------------------------------------------
            判断下一条是否为 Markdown separator
            --------------------------------------------------
            */

            if (
                separatorIndex < lines.length &&
                isTableSeparator(
                    lines[separatorIndex]
                )
            ) {

                const header =
                    parseTableRow(
                        lines[i]
                    );

                /*
                跳过：

                header
                blank lines
                separator
                blank lines
                */

                i =
                    separatorIndex + 1;

                const rows = [];

                /*
                --------------------------------------------------
                收集表格数据行

                允许：

                | VIX | 15.22 |

                空行

                | MOVE | 79.71 |
                --------------------------------------------------
                */

                while (
                    i < lines.length
                ) {

                    const rowLine =
                        lines[i].trim();

                    /*
                    空行
                    */

                    if (rowLine === "") {

                        let lookAhead =
                            i + 1;

                        while (
                            lookAhead < lines.length &&
                            lines[lookAhead].trim() === ""
                        ) {
                            lookAhead++;
                        }

                        /*
                        后面还是表格行
                        */

                        if (
                            lookAhead < lines.length &&
                            (
                                lines[lookAhead]
                                    .trim()
                                    .startsWith("|") ||

                                lines[lookAhead]
                                    .trim()
                                    .startsWith("\\|")
                            )
                        ) {

                            i++;

                            continue;
                        }

                        /*
                        表格结束
                        */

                        break;
                    }

                    /*
                    表格行
                    */

                    if (
                        rowLine.startsWith("|") ||
                        rowLine.startsWith("\\|")
                    ) {

                        rows.push(
                            parseTableRow(
                                lines[i]
                            )
                        );

                        i++;

                        continue;
                    }

                    /*
                    非表格内容
                    */

                    break;
                }

                /*
                --------------------------------------------------
                生成 HTML
                --------------------------------------------------
                */

                let html = `
<div class="table-wrapper">
<table>
<thead>
<tr>
`;

                header.forEach(
                    cell => {

                        html +=
                            "<th>" +
                            cell.trim() +
                            "</th>";

                    }
                );

                html += `
</tr>
</thead>
<tbody>
`;

                rows.forEach(
                    row => {

                        html += "<tr>";

                        /*
                        保证列数与 header 一致
                        */

                        for (
                            let index = 0;
                            index < header.length;
                            index++
                        ) {

                            const cell =
                                row[index] !== undefined
                                    ? row[index]
                                    : "";

                            html +=
                                "<td>" +
                                cell.trim() +
                                "</td>";

                        }

                        html +=
                            "</tr>";

                    }
                );

                html += `
</tbody>
</table>
</div>
`;

                output.push(
                    html
                );

                /*
                不再 i++
                因为上面的 while
                已经把 i 推到了表格结束位置
                */

                continue;
            }
        }

        /*
        --------------------------------------------------
        普通内容
        --------------------------------------------------
        */

        output.push(
            lines[i]
        );

        i++;
    }

    return output
    .join("\n")
    .replace(/\n{3,}/g, "\n\n");
}



/* ======================================================
   TABLE HELPERS
====================================================== */

/* ======================================================
   TABLE SEPARATOR DETECTOR
====================================================== */

function isTableSeparator(line) {

    const cells =
        parseTableRow(line);

    if (cells.length < 2) {
        return false;
    }

    return cells.every(
        cell => {

            const value =
                cell.trim();

            return /^:?-{3,}:?$/.test(
                value
            );

        }
    );
}

/* ======================================================
   TABLE ROW PARSER
   支持：

   | VIX | 15.2200 |

   \| VIX | 15.2200 |
====================================================== */

function parseTableRow(line) {

    let value =
        line.trim();

    /*
    --------------------------------------------------
    去掉 Markdown 转义的开头 \|
    --------------------------------------------------
    */

    if (
        value.startsWith("\\|")
    ) {

        value =
            value.substring(2);

    }
    else if (
        value.startsWith("|")
    ) {

        value =
            value.substring(1);

    }

    /*
    --------------------------------------------------
    去掉最后一个 |
    --------------------------------------------------
    */

    if (
        value.endsWith("|")
    ) {

        value =
            value.substring(
                0,
                value.length - 1
            );

    }

    return value
        .split("|")
        .map(
            cell =>
                cell.trim()
        );
}



/* ======================================================
   EXTRACT DATE
====================================================== */

function extractReportDate(
    markdown,
    filename
) {


    const match =
        markdown.match(
            /Report Date:\*\*\s*(\d{4}-\d{2}-\d{2})/
        );


    if (match) {

        return match[1];

    }


    const fileMatch =
        filename.match(
            /(\d{8})/
        );


    if (fileMatch) {

        const value =
            fileMatch[1];


        return (
            value.substring(0, 4) +
            "-" +
            value.substring(4, 6) +
            "-" +
            value.substring(6, 8)
        );

    }


    return "";

}



/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHTML(
    value
) {


    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
